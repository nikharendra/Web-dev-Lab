<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <nav class="navbar">

        <div class="logo">
            DepartmentMS
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <h2>Login</h2>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn primary-btn"
                >
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <script src="js/login.js"></script>

</body>

</html>
